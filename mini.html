<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta content="#111114" name="theme-color"/><meta name="description" content="The BLACKBOX compact playback window."><title>BLACKBOX Mini Player</title>
<style>
:root{color-scheme:dark;--accent:#ff861c;--accent-soft:rgba(255,134,28,.16);--text:#f5f4f8;--muted:#aaa9b8;--line:rgba(255,255,255,.11)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0d12;color:var(--text);font-family:Inter,"Segoe UI",sans-serif}
body{background:radial-gradient(ellipse at 6% 5%,var(--accent-soft),transparent 55%),linear-gradient(135deg,rgba(255,255,255,.055),transparent 50%),#0d0d12}
.shell{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;padding:12px;gap:9px;backdrop-filter:blur(22px)}
.top{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;align-items:center;min-height:0}
.art{width:78px;height:78px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:linear-gradient(140deg,var(--accent-soft),rgba(255,255,255,.025));box-shadow:0 12px 28px #0007,inset 0 1px 0 #ffffff22;display:grid;place-items:center;color:var(--accent);font-size:29px}.art img{display:block;width:100%;height:100%;object-fit:cover}
.info{min-width:0}.brand{font:8px Consolas,monospace;letter-spacing:1.5px;color:var(--accent);margin-bottom:7px}.title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.album{font:8px Consolas,monospace;letter-spacing:.6px;color:#858493;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:grid;grid-template-columns:30px 34px 30px minmax(45px,1fr) 30px;gap:6px;align-items:center}.btn{border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);border-radius:7px;width:30px;height:30px;cursor:pointer}.btn:hover{background:var(--accent-soft);border-color:var(--accent)}.btn.play{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#151017;border-color:transparent;font-weight:800}.volume{width:100%;min-width:38px;accent-color:var(--accent)}
.bottom{display:flex;align-items:center;gap:9px}.timeline{display:grid;grid-template-columns:33px 1fr 33px;align-items:center;gap:6px;font:8px Consolas,monospace;color:var(--muted);min-width:0;flex:1}.timeline input{width:100%;min-width:0;accent-color:var(--accent)}.bottom-actions{display:flex;gap:5px}.status{font:7px Consolas,monospace;letter-spacing:.8px;color:#777684;white-space:nowrap}@media(max-width:360px){.shell{padding:8px}.top{grid-template-columns:64px minmax(0,1fr)}.art{width:64px;height:64px}.title{font-size:13px}.controls{grid-template-columns:28px 32px 28px minmax(35px,1fr) 28px;gap:4px}.btn{width:28px;height:28px}.btn.play{width:32px;height:32px}.status{display:none}}
</style>
</head>
<body><main class="shell"><section class="top"><div class="art" id="art">◖</div><div class="info"><div class="brand">BLACKBOX / MINI DECK</div><div class="title" id="title">Nothing playing</div><div class="artist" id="artist">Open the main player to begin</div><div class="album" id="album">LOCAL AUDIO SYSTEM</div></div></section><section class="controls"><button class="btn" data-cmd="previous" title="Previous track">|◀</button><button class="btn play" data-cmd="toggle" title="Play / pause">▶</button><button class="btn" data-cmd="next" title="Next track">▶|</button><input class="volume" id="volume" max="100" min="0" title="Volume" type="range" value="85"/><button class="btn" data-cmd="favorite" title="Toggle favorite">♡</button></section><section class="bottom"><div class="timeline"><span id="current">00:00</span><input aria-label="Seek" id="seek" max="1000" min="0" type="range" value="0"/><span id="duration">00:00</span></div><div class="bottom-actions"><button class="btn" data-cmd="mute" title="Mute">◖</button><button class="btn" data-cmd="shuffle" id="shuffle" title="Shuffle">⤨</button><button class="btn" data-cmd="main" title="Open main player">↗</button></div><span class="status" id="status">READY</span></section></main>
<script src="mini.js"></script></body></html>
